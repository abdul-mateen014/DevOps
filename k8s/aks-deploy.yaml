apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
        - name: notes-app
          image: abdulmateen014/notes-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: notes-app
  ports:
    - port: 80
      targetPort: 3000