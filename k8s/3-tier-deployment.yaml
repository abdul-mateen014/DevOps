---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-frontend
  template:
    metadata:
      labels:
        app: notes-frontend
    spec:
      containers:
        - name: frontend
          image: abdulmateen014/notes-app-frontend:v1
          ports:
            - containerPort: 80

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: notes-frontend-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: notes-frontend

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-backend
  template:
    metadata:
      labels:
        app: notes-backend
    spec:
      containers:
        - name: backend
          image: abdulmateen014/notes-app-backend:v1
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_FILE
              value: "/app/data/notes.db"
          volumeMounts:
            - name: db-storage
              mountPath: /app/data
      volumes:
        - name: db-storage
          emptyDir: {}

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: notes-backend-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: notes-backend
